    <header>

        </nav>

    <main>
        <section id="contact">
            <h1>Contact Me</h1>
            <div class="contact-info">
                <p><strong>Email:</strong> <a href="mailto:chinonsohensley@gmail.com">chinonsohensley@gmail.com</a></p>
                <div class="social-links">
                    <a href="https://www.linkedin.com/in/hensley-ukah" target="_blank" class="social-icon">[in]</a>
                    <a href="https://github.com/jeremysley" target="_blank" class="social-icon">[gh]</a>
                </div>
            </div>
            <p>If you'd like to get in touch, please fill out the form below. I'm always open to discussing new projects, creative ideas, or opportunities to collaborate.</p>
            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </section>
    </main>
